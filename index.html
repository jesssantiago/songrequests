<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Agent - Song Requests</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.header{
    height:60px;
    min-height:60px;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.user-item{
    width:100%;
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:10px;
    box-shadow:0 2px 7px rgba(0,0,0,.12);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.user-item:active{
    transform:scale(.99);
}

.username{
    font-size:19px;
    font-weight:bold;
    color:#111;
}

.arrow{
    font-size:22px;
    color:#777;
}

.status{
    font-size:12px;
    font-weight:bold;
    margin-left:auto;
    margin-right:12px;
}

.status.approved{
    color:#159447;
}

.message{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    padding:15px;
    box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.message-header{
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.back-btn{
    width:42px;
    height:38px;
    border:0;
    border-radius:7px;
    background:#111;
    color:white;
    font-size:20px;
    margin-right:10px;
}

.message-username{
    font-size:19px;
    font-weight:bold;
}

.time{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.approval-status{
    margin:10px 0;
    padding:11px;
    border-radius:8px;
    text-align:center;
    font-size:15px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.approved{
    background:#d4edda;
    color:#155724;
}

.approve-btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:8px;
    background:#159447;
    color:white;
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

.approve-btn:active{
    transform:scale(.98);
}

.approve-btn:disabled{
    background:#aaa;
}

.song{
    border-top:1px solid #eee;
    padding:12px 0;
}

.song-number{
    font-size:12px;
    color:#888;
    margin-bottom:3px;
}

.song-title{
    font-size:18px;
    font-weight:bold;
    color:#111;
}

.singer{
    font-size:15px;
    color:#666;
    margin-top:4px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:16px;
}
</style>

</head>

<body>

<div class="container">


<div class="header">
    AGENT — SONG REQUESTS
</div>

<div class="chat" id="chat">

    <div class="empty">
        Waiting for song requests...
    </div>

</div>

<button class="back-btn" onclick="history.back()"> 
    ←
</button> 
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyC1xYHp6yVVVnNr6K9Hhlq2FLWwYv0Q78Q",

    authDomain: "chatrequests-17be0.firebaseapp.com",

    databaseURL: "https://chatrequests-17be0-default-rtdb.firebaseio.com/",

    projectId: "chatrequests-17be0",

    storageBucket: "chatrequests-17be0.firebasestorage.app",

    messagingSenderId: "159806985649",

    appId: "1:159806985649:web:a847633be48278bcd71990",

    measurementId: "G-JMMWRE8XTZ"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const requestsRef = ref(db,"chatRequests");

const chat = document.getElementById("chat");


let requests = {};

let selectedRequest = null;


/* 2 HOURS */

const TWO_HOURS = 2 * 60 * 60 * 1000;


/* LOAD REQUESTS */

onValue(requestsRef,function(snapshot){

    requests = snapshot.val() || {};

    checkExpiredApprovedRequests();

    if(selectedRequest && requests[selectedRequest]){

        showMessage(
            selectedRequest,
            requests[selectedRequest]
        );

    }else{

        showUsers();

    }

});


/* CHECK APPROVED REQUESTS */

async function checkExpiredApprovedRequests(){

    const now = Date.now();

    const entries = Object.entries(requests);


    for(const [id,request] of entries){

        if(
            request.approved === true &&
            request.approvedAt &&
            now - request.approvedAt >= TWO_HOURS
        ){

            try{

                await remove(
                    ref(db,"chatRequests/" + id)
                );

                if(selectedRequest === id){

                    selectedRequest = null;

                }

            }catch(error){

                console.error(
                    "Failed to auto-delete request:",
                    error
                );

            }

        }

    }

}


/*
    CHECK EVERY MINUTE
*/

setInterval(function(){

    if(Object.keys(requests).length > 0){

        checkExpiredApprovedRequests();

    }

},60000);


/* SHOW USERNAMES */

function showUsers(){

    selectedRequest = null;

    chat.innerHTML = "";


    const entries = Object.entries(requests);


    if(entries.length === 0){

        chat.innerHTML = `
            <div class="empty">
                Waiting for song requests...
            </div>
        `;

        return;

    }


    entries.reverse().forEach(function([id,request]){

        const userItem = document.createElement("div");

        userItem.className = "user-item";


        const username = document.createElement("div");

        username.className = "username";

        username.textContent =
            request.username || "Unknown User";


        const status = document.createElement("div");

        status.className = "status";


        if(request.approved === true){

            status.textContent = "APPROVED";

            status.classList.add("approved");

        }


        const arrow = document.createElement("div");

        arrow.className = "arrow";

        arrow.textContent = "›";


        userItem.appendChild(username);


        if(request.approved === true){

            userItem.appendChild(status);

        }


        userItem.appendChild(arrow);


        userItem.addEventListener("click",function(){

            showMessage(id,request);

        });


        chat.appendChild(userItem);

    });

}


/* SHOW MESSAGE */

function showMessage(id,request){

    selectedRequest = id;

    chat.innerHTML = "";


    const message = document.createElement("div");

    message.className = "message";


    /* HEADER */

    const header = document.createElement("div");

    header.className = "message-header";


    const backButton = document.createElement("button");

    backButton.className = "back-btn";

    backButton.textContent = "‹";


    backButton.addEventListener("click",function(){

        showUsers();

    });


    const headerText = document.createElement("div");


    const username = document.createElement("div");

    username.className = "message-username";

    username.textContent =
        request.username || "Unknown User";


    const time = document.createElement("div");

    time.className = "time";


    if(request.timestamp){

        time.textContent =
            new Date(request.timestamp).toLocaleString();

    }


    headerText.appendChild(username);

    headerText.appendChild(time);


    header.appendChild(backButton);

    header.appendChild(headerText);

    message.appendChild(header);


    /* APPROVAL STATUS */

    const approvalStatus = document.createElement("div");

    approvalStatus.className = "approval-status";


    if(request.approved === true){

        approvalStatus.classList.add("approved");

        approvalStatus.textContent =
            "✓ APPROVED";

    }else{

        approvalStatus.classList.add("pending");

        approvalStatus.textContent =
            "WAITING FOR APPROVAL";

    }


    message.appendChild(approvalStatus);


    /* APPROVE BUTTON */

    if(request.approved !== true){

        const approveButton = document.createElement("button");

        approveButton.className = "approve-btn";

        approveButton.textContent =
            "APPROVE REQUEST";


        approveButton.addEventListener(
            "click",
            async function(){

                approveButton.disabled = true;

                approveButton.textContent =
                    "APPROVING...";


                try{

                    await update(
                        ref(db,"chatRequests/" + id),
                        {
                            approved:true,
                            approvedAt:Date.now()
                        }
                    );

                }catch(error){

                    console.error(error);

                    alert(
                        "Failed to approve request."
                    );

                    approveButton.disabled = false;

                    approveButton.textContent =
                        "APPROVE REQUEST";

                }

            }
        );


        message.appendChild(approveButton);

    }


    /* SONGS */

    if(request.songs){

        Object.values(request.songs).forEach(
            function(song,index){

                const songBox =
                    document.createElement("div");

                songBox.className = "song";


                const number =
                    document.createElement("div");

                number.className = "song-number";

                number.textContent =
                    "SONG " + (index + 1);


                const title =
                    document.createElement("div");

                title.className = "song-title";

                title.textContent =
                    song.songTitle;


                const singer =
                    document.createElement("div");

                singer.className = "singer";

                singer.textContent =
                    "Singer: " + song.singerName;


                songBox.appendChild(number);

                songBox.appendChild(title);

                songBox.appendChild(singer);


                message.appendChild(songBox);

            }
        );

    }


    chat.appendChild(message);

    chat.scrollTop = 0;

}

</script>

</body>
</html>
