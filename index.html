<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Agent - Song Requests</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.header{
    height:60px;
    min-height:60px;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

/* USERNAME ITEM */

.user-item{
    width:100%;
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:10px;
    box-shadow:0 2px 7px rgba(0,0,0,.12);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.user-item:active{
    transform:scale(.99);
}

.username{
    font-size:19px;
    font-weight:bold;
    color:#111;
}

.arrow{
    font-size:22px;
    color:#777;
}

/* MESSAGE */

.message{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    padding:15px;
    box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.message-header{
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.back-btn{
    width:42px;
    height:38px;
    border:0;
    border-radius:7px;
    background:#111;
    color:white;
    font-size:20px;
    margin-right:10px;
}

.message-username{
    font-size:19px;
    font-weight:bold;
}

.time{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.song{
    border-top:1px solid #eee;
    padding:12px 0;
}

.song-number{
    font-size:12px;
    color:#888;
    margin-bottom:3px;
}

.song-title{
    font-size:18px;
    font-weight:bold;
    color:#111;
}

.singer{
    font-size:15px;
    color:#666;
    margin-top:4px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:16px;
}

/* NEW INDICATOR */

.new-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#159447;
    margin-left:auto;
    margin-right:12px;
}
</style>

</head>

<body>

<div class="container">


<div class="header">
    AGENT — SONG REQUESTS
</div>

<div class="chat" id="chat">

    <div class="empty">
        Waiting for song requests...
    </div>

</div>


</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyC1xYHp6yVVVnNr6K9Hhlq2FLWwYv0Q78Q",

    authDomain: "chatrequests-17be0.firebaseapp.com",

    databaseURL: "https://chatrequests-17be0-default-rtdb.firebaseio.com/",

    projectId: "chatrequests-17be0",

    storageBucket: "chatrequests-17be0.firebasestorage.app",

    messagingSenderId: "159806985649",

    appId: "1:159806985649:web:a847633be48278bcd71990",

    measurementId: "G-JMMWRE8XTZ"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const requestsRef = ref(db,"chatRequests");

const chat = document.getElementById("chat");


let requests = {};

let selectedRequest = null;


/* LOAD REQUESTS */

onValue(requestsRef,function(snapshot){

    requests = snapshot.val() || {};

    showUsers();

});


/* SHOW USERNAMES */

function showUsers(){

    selectedRequest = null;

    chat.innerHTML = "";


    const entries = Object.entries(requests);


    if(entries.length === 0){

        chat.innerHTML = `
            <div class="empty">
                Waiting for song requests...
            </div>
        `;

        return;

    }


    entries.reverse().forEach(function([id,request]){

        const userItem = document.createElement("div");

        userItem.className = "user-item";


        const username = document.createElement("div");

        username.className = "username";

        username.textContent = request.username || "Unknown User";


        const arrow = document.createElement("div");

        arrow.className = "arrow";

        arrow.textContent = "›";


        userItem.appendChild(username);

        userItem.appendChild(arrow);


        userItem.addEventListener("click",function(){

            showMessage(id,request);

        });


        chat.appendChild(userItem);

    });

}


/* SHOW MESSAGE */

function showMessage(id,request){

    selectedRequest = id;

    chat.innerHTML = "";


    const message = document.createElement("div");

    message.className = "message";


    /* HEADER */

    const header = document.createElement("div");

    header.className = "message-header";


    const backButton = document.createElement("button");

    backButton.className = "back-btn";

    backButton.textContent = "‹";


    backButton.addEventListener("click",function(){

        showUsers();

    });


    const headerText = document.createElement("div");


    const username = document.createElement("div");

    username.className = "message-username";

    username.textContent = request.username || "Unknown User";


    const time = document.createElement("div");

    time.className = "time";


    if(request.timestamp){

        time.textContent = new Date(
            request.timestamp
        ).toLocaleString();

    }


    headerText.appendChild(username);

    headerText.appendChild(time);


    header.appendChild(backButton);

    header.appendChild(headerText);


    message.appendChild(header);


    /* SONGS */

    if(request.songs){

        Object.values(request.songs).forEach(function(song,index){

            const songBox = document.createElement("div");

            songBox.className = "song";


            const number = document.createElement("div");

            number.className = "song-number";

            number.textContent = "SONG " + (index + 1);


            const title = document.createElement("div");

            title.className = "song-title";

            title.textContent = song.songTitle;


            const singer = document.createElement("div");

            singer.className = "singer";

            singer.textContent =
                "Singer: " + song.singerName;


            songBox.appendChild(number);

            songBox.appendChild(title);

            songBox.appendChild(singer);


            message.appendChild(songBox);

        });

    }


    chat.appendChild(message);

    chat.scrollTop = 0;

}

</script>

</body>
</html>
